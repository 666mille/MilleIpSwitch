name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (MSVC)
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release

      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build/Release/milleipswitch.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:TEMP\milleipswitch-selftest.log"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Checksum and package manifests
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $hash = (Get-FileHash build/Release/milleipswitch.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  milleipswitch.exe" | Out-File -Encoding ascii build/Release/milleipswitch.exe.sha256
          $ver = "${{ github.ref_name }}".TrimStart('v')
          python tools/make_manifests.py --version $ver --sha256 $hash --out dist
          Compress-Archive -Path dist/winget -DestinationPath dist/winget-manifests.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MilleIpSwitch
          path: |
            build/Release/milleipswitch.exe
            profiles.example.ini

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Release/milleipswitch.exe
            build/Release/milleipswitch.exe.sha256
            dist/scoop/milleipswitch.json
            dist/winget-manifests.zip
            profiles.example.ini
          generate_release_notes: true
