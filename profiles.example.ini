# MilleIpSwitch profiles – copy to profiles.ini next to milleipswitch.exe
# (or simply create profiles in the GUI)
#
# adapter = name as shown in "Network Connections" (e.g. Ethernet, Wi-Fi)
# dhcp    = yes / no
# ip      = one or more addresses with prefix: 192.168.1.10/24, 10.0.0.5/255.0.0.0
# gateway = optional
# dns     = optional, comma-separated; empty with DHCP = DNS from the DHCP server
# ipv6    = auto / static (leave out to keep IPv6 untouched)
# ip6, gateway6, dns6 = IPv6 counterparts, ip6 with prefix: 2001:db8::10/64
# auto    = yes activates the profile automatically (AutoSwitch)
# auto_gateway_mac, auto_ping = optional AutoSwitch conditions

[Office (DHCP)]
adapter = Ethernet
dhcp    = yes

[Lab]
adapter = Ethernet
dhcp    = no
ip      = 192.168.10.50/24
gateway = 192.168.10.1
dns     = 192.168.10.1, 1.1.1.1
ipv6    = static
ip6     = 2001:db8:10::50/64
gateway6 = 2001:db8:10::1
dns6    = 2001:4860:4860::8888
auto    = yes
auto_gateway_mac = AA-BB-CC-DD-EE-FF

[Devices direct]
adapter = Ethernet
dhcp    = no
ip      = 192.168.1.100/24, 10.0.0.100/8
